  <defs>
    <linearGradient id="tmark-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="oklch(0.62 0.14 39)" />
      <stop offset="1" stop-color="oklch(0.55 0.16 50)" />
    </linearGradient>
  </defs>
  <path fill="url(#tmark-orange)" d="M28 24 L100 24 L100 32 L86 40 L100 48 L100 56 L72 56 L72 108 L56 108 L56 56 L28 56 Z" />
