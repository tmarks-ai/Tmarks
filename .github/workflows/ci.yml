name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to the commit SHA of their v4 tag
      # (git ls-remote <repo> refs/tags/v4^{}), not a moving tag: a tag can
      # be retargeted by a compromised account. Bump by re-resolving the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm test
      - name: Code size gate (≤300 lines/file)
        run: pnpm check:code-size
      - name: Build
        run: pnpm build
      # Landing is a standalone Vite project outside the workspace, so the
      # steps above never touch it — gate it explicitly (type-check + full
      # prerender build) so a broken landing cannot merge.
      - name: Install landing dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: landing
      - name: Landing type-check + build (prerender)
        run: pnpm type-check && pnpm build
        working-directory: landing