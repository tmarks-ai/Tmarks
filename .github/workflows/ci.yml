name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_registration:
        description: 'Temporarily open registration? (uncheck after first account)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to the commit SHA of their v4 tag
      # (git ls-remote <repo> refs/tags/v4^{}), not a moving tag: a tag can
      # be retargeted by a compromised account. Bump by re-resolving the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm test
      - name: Code size gate (≤300 lines/file)
        run: pnpm check:code-size
      - name: Build
        run: pnpm build
      # Landing is a standalone Vite project outside the workspace, so the
      # steps above never touch it — gate it explicitly (type-check + full
      # prerender build) so a broken landing cannot merge.
      - name: Install landing dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: landing
      - name: Landing type-check + build (prerender)
        run: pnpm type-check && pnpm build
        working-directory: landing

  # Auto-deploy to Cloudflare Workers on push to main (after all checks pass).
  # Required GitHub Secrets (Settings → Secrets and variables → Actions):
  #   CLOUDFLARE_API_TOKEN   — Cloudflare API token with Workers deploy perms
  #   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID (Dashboard right sidebar)
  #   D1_DATABASE_ID         — D1 database UUID (from `wrangler d1 create`)
  #
  # First-time setup (one-time, run locally):
  #   1. wrangler d1 create tmarks-db       → copy the database_id to secrets
  #   2. wrangler r2 bucket create tmarks-snapshots
  #   3. wrangler secret put JWT_SECRET     (persists across all future deploys)
  #   4. Push to main → CI auto-deploys
  #   5. Manually trigger this workflow with "allow_registration" checked →
  #      register your account → trigger again without it to close registration.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.D1_DATABASE_ID }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::Cloudflare secrets not configured — deploy skipped. See README '方案 B' for setup."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 10.28.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build web app
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm --filter @tmarks/web build
      - name: Fill D1 database_id
        if: steps.secrets.outputs.configured == 'true'
        run: sed -i "s|<your-d1-database-id>|$D1_DATABASE_ID|" apps/worker/wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      - name: Apply D1 migrations
        if: steps.secrets.outputs.configured == 'true'
        run: cd apps/worker && npx wrangler d1 migrations apply tmarks-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker
        if: steps.secrets.outputs.configured == 'true'
        run: |
          cd apps/worker
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.allow_registration }}" == "true" ]; then
            EXTRA_ARGS="--var ALLOW_REGISTRATION:true"
            echo "WARNING: Registration is temporarily OPEN. Trigger again without the checkbox to close it."
          fi
          npx wrangler deploy $EXTRA_ARGS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}