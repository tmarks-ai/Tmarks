name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      allow_registration:
        description: 'Temporarily open registration? (uncheck after first account)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to the commit SHA of the vX tag the
      # comment names (git ls-remote <repo> refs/tags/vX^{}), not a moving tag:
      # a tag can be retargeted by a compromised account. Bump by re-resolving.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm type-check
      - name: Test
        run: pnpm test
      - name: Code size gate (≤300 lines/file)
        run: pnpm check:code-size
      - name: Build
        run: pnpm build
      # Landing is a standalone Vite project outside the workspace, so the
      # steps above never touch it — gate it explicitly (type-check + full
      # prerender build) so a broken landing cannot merge.
      - name: Install landing dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: landing
      - name: Landing type-check + build (prerender)
        run: pnpm type-check && pnpm build
        working-directory: landing

  # Auto-deploy to Cloudflare Workers on push to main (after all checks pass).
  # Required GitHub Secrets (Settings → Secrets and variables → Actions):
  #   CLOUDFLARE_API_TOKEN   — Cloudflare API token with Workers deploy perms
  #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare Account ID (Dashboard right sidebar)
  #   JWT_SECRET             — ≥32 chars; re-sent to the Worker every run
  # (D1_DATABASE_ID is NOT a secret — the deploy step discovers it via
  # `wrangler d1 list`, R8 CD-7.)
  #
  # First-time setup (one-time, run locally):
  #   1. wrangler d1 create tmarks-db       → copy the database_id to secrets
  #   2. wrangler r2 bucket create tmarks-snapshots
  #   3. wrangler secret put JWT_SECRET     (persists across all future deploys)
  #   4. Push to main → CI auto-deploys
  #   5. Manually trigger this workflow with "allow_registration" checked →
  #      register your account → trigger again without it to close registration.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] || [ -z "${{ secrets.JWT_SECRET }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::Cloudflare secrets not configured — deploy skipped. See README '方案 B' for setup."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 10.28.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build web app
        if: steps.secrets.outputs.configured == 'true'
        run: pnpm --filter @tmarks/web build

      - name: Provision D1 + R2 + JWT secret (auto, first run creates everything)
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # ① Create D1 database if it doesn't exist
          if ! npx wrangler d1 info tmarks-db --remote 2>/dev/null; then
            echo "::group::Creating D1 database"
            npx wrangler d1 create tmarks-db
            echo "::endgroup::"
          else
            echo "D1 database tmarks-db already exists"
          fi

          # ② Discover the database_id
          DATABASE_ID=$(npx wrangler d1 list --json 2>/dev/null \
            | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); const db=d.find(x=>x.name==='tmarks-db'); console.log(db?db.uuid:'')")
          if [ -z "$DATABASE_ID" ]; then
            echo "ERROR: Could not find database_id for tmarks-db"
            exit 1
          fi
          echo "database_id=$DATABASE_ID"
          sed -i "s|<your-d1-database-id>|$DATABASE_ID|" wrangler.toml

          # ③ Create R2 bucket if it doesn't exist. R2 must be activated in the
          #    Dashboard first (one-time, code 10042 — no API/CLI flag); when it
          #    is not activated the [[r2_buckets]] binding would fail deploy, so
          #    this run comments the section out and deploys in no-snapshot
          #    degraded mode (R8-M2). Each run starts from the repo checkout, so
          #    activating R2 later restores snapshots on the next run.
          if ! npx wrangler r2 bucket create tmarks-snapshots 2>/dev/null; then
            if npx wrangler r2 bucket list 2>/dev/null | grep -q tmarks-snapshots; then
              echo "R2 bucket tmarks-snapshots already exists"
            else
              echo "::warning::R2 未在 Dashboard 激活(一次性,https://dash.cloudflare.com → R2)——以无快照降级模式部署;激活后重新触发本 workflow 即可恢复快照功能"
              sed -i '/^\[\[r2_buckets\]\]/,/^bucket_name/ s/^/# /' wrangler.toml
            fi
          fi

          # ④ Set JWT secret (idempotent — overwrites if already set)
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET

      - name: Apply D1 migrations
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply tmarks-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: steps.secrets.outputs.configured == 'true'
        working-directory: apps/worker
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.allow_registration }}" == "true" ]; then
            EXTRA_ARGS="--var ALLOW_REGISTRATION:true"
            echo "WARNING: Registration is temporarily OPEN. Trigger again without the checkbox to close it."
          fi
          npx wrangler deploy $EXTRA_ARGS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}